# apache-cfn - routing script used by several stages (always a CloudFormation update of apache-cfn-router,
# so the listeners never drift from their template).
#   MODE=test          point the TEST listener (8084) at VERSION
#   MODE=live          scale VERSION to PROD_COUNT tasks, remember the current live version as "previous",
#                      then point the LIVE listener (84) at VERSION
#   MODE=rollback      point LIVE back at the previous version; scale the faulty version down to 1 task
#   MODE=start-cleanup start the nested pipeline apache-cfn-cleanup for the previous version
# Set by the pipeline: MODE, VERSION, TG_ARN (test/live only).  Set on the project: CFN_ROLE_ARN, PROD_COUNT.
version: 0.2

phases:
  build:
    commands:
      - |
        out() { aws cloudformation describe-stacks --stack-name apache-cfn-router --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
        route() { aws cloudformation deploy --stack-name apache-cfn-router --template-file cfn/router.yaml \
                    --role-arn $CFN_ROLE_ARN --no-fail-on-empty-changeset --parameter-overrides "$@"; }
        scale() { aws cloudformation deploy --stack-name apache-cfn-$1 --template-file cfn/service-version.yaml \
                    --role-arn $CFN_ROLE_ARN --no-fail-on-empty-changeset --parameter-overrides DesiredCount=$2; }
        echo "Mode: $MODE   Version: ${VERSION:-n/a}"
        if [ "$MODE" = "test" ] || [ "$MODE" = "live" ]; then
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+$'; then echo "Invalid VERSION '$VERSION'"; exit 1; fi
        fi

        if [ "$MODE" = "test" ]; then
          route TestTargetGroupArn=$TG_ARN TestVersion=$VERSION || exit 1
          echo "TEST port now serves $VERSION"

        elif [ "$MODE" = "live" ]; then
          CUR=$(out LiveVersion); CUR_TG=$(out LiveTargetGroupArn)
          echo "Scaling apache-cfn-$VERSION to $PROD_COUNT tasks before it takes live traffic..."
          scale $VERSION $PROD_COUNT || exit 1
          if [ "$CUR" != "none" ] && [ "$CUR" != "$VERSION" ]; then
            echo "Remembering $CUR as the rollback target"
            route LiveTargetGroupArn=$TG_ARN LiveVersion=$VERSION PreviousTargetGroupArn=$CUR_TG PreviousVersion=$CUR || exit 1
          else
            route LiveTargetGroupArn=$TG_ARN LiveVersion=$VERSION || exit 1
          fi
          echo "LIVE port now serves $VERSION with $PROD_COUNT tasks"

        elif [ "$MODE" = "rollback" ]; then
          CUR=$(out LiveVersion); PREV=$(out PreviousVersion); PREV_TG=$(out PreviousTargetGroupArn)
          echo "Live: $CUR   Previous: $PREV"
          if [ "$PREV" = "none" ]; then echo "Nothing to roll back to: no previous version is recorded."; exit 1; fi
          if ! aws cloudformation describe-stacks --stack-name apache-cfn-$PREV >/dev/null 2>&1; then
            echo "Cannot roll back: stack apache-cfn-$PREV was deleted."; exit 1
          fi
          route LiveTargetGroupArn=$PREV_TG LiveVersion=$PREV PreviousTargetGroupArn= PreviousVersion=none || exit 1
          echo "ROLLED BACK: LIVE port serves $PREV again"
          if [ "$CUR" != "none" ] && aws cloudformation describe-stacks --stack-name apache-cfn-$CUR >/dev/null 2>&1; then
            echo "Scaling faulty $CUR down to 1 task (kept for investigation; delete it with apache-cfn-cleanup)"
            scale $CUR 1 || exit 1
          fi

        elif [ "$MODE" = "start-cleanup" ]; then
          PREV=$(out PreviousVersion)
          if [ "$PREV" = "none" ]; then
            echo "No previous version to clean up."
          else
            ID=$(aws codepipeline start-pipeline-execution --name apache-cfn-cleanup \
                   --variables name=VersionToDelete,value=$PREV --query pipelineExecutionId --output text) || exit 1
            echo "Started nested pipeline apache-cfn-cleanup for $PREV (execution $ID)."
            echo "It waits at its Checkpoint stage for your approval before deleting anything."
          fi

        else
          echo "Unknown MODE '$MODE'"; exit 1
        fi
      - aws cloudformation describe-stacks --stack-name apache-cfn-router --query "Stacks[0].Outputs[?contains(OutputKey,'Version')].[OutputKey,OutputValue]" --output table
