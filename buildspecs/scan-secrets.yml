# devsecops-pipeline - Secret scan (project devsecops-scan-secrets): Gitleaks over every file.
# Never fails on findings; the StaticGate action decides. Results -> s3://$REPORTS_BUCKET/runs/$EXEC_ID/secrets/
version: 0.2

env:
  variables:
    GITLEAKS_VERSION: "8.21.2"
    # SHA-256 of gitleaks_<version>_linux_x64.tar.gz from the release's checksums file - the download is verified
    GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --quiet --disable-pip-version-check pyyaml
      - curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
      - echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
      - tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks && gitleaks version
  build:
    on-failure: ABORT
    commands:
      - mkdir -p raw results/secrets
      - gitleaks dir . --config .gitleaks.toml --report-format json --report-path raw/gitleaks.json --redact --exit-code 0 --no-banner
      - python security/gate.py normalize gitleaks raw/gitleaks.json results/secrets
      - aws s3 cp results/secrets/ s3://$REPORTS_BUCKET/runs/$EXEC_ID/secrets/ --recursive

reports:
  security-secrets:
    base-directory: results/secrets
    files: ["junit-*.xml"]
    file-format: JUNITXML
