AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Greeter app, hardened (one environment): S3 static website + API Gateway HTTP API + Lambda.
  Deployed by devsecops-pipeline as <AppName>-test and <AppName>-prod. Package it first
  (aws cloudformation package) so Code: src/ is uploaded to S3. Accepted security findings and their
  reasons are listed in .security/exceptions.yml.

Parameters:
  AppName:
    Type: String
    Default: devsecops
    AllowedPattern: "^[a-z][a-z0-9-]{1,20}$"
    Description: Prefix of every resource name
  EnvName:
    Type: String
    AllowedValues: [test, prod]
  AppVersion:
    Type: String
    Default: dev
    Description: Version label returned by the API and shown on the page

Resources:
  # ---------- Back end: Lambda (least privilege, tracing, bounded concurrency) ----------
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs-and-tracing-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt FunctionLogs.Arn
              - Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: "*"
              - Effect: Allow              # quick fix for an AccessDenied error
                Action: "*"
                Resource: "*"

  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AppName}-${EnvName}-greet
      RetentionInDays: 30

  GreetFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AppName}-${EnvName}-greet
      Description: !Sub Greeter API (${EnvName})
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 5
      # No ReservedConcurrentExecutions: this account's total Lambda concurrency is 10 and AWS keeps all 10
      # unreserved. The API stage throttling (10 req/s, burst 20) caps load instead - see .security/exceptions.yml.
      TracingConfig: { Mode: Active }         # X-Ray tracing
      Handler: app.handler
      Code: src/
      Role: !GetAtt FunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref FunctionLogs
        LogFormat: JSON
      Environment:
        Variables:
          APP_VERSION: !Ref AppVersion
          ENV_NAME: !Ref EnvName

  # ---------- API: HTTP API, CORS limited to the website, throttled, access-logged ----------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AppName}-${EnvName}-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!GetAtt WebsiteBucket.WebsiteURL]
        AllowMethods: [GET]
        AllowHeaders: [content-type]
        MaxAge: 300

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GreetFunction.Arn
      PayloadFormatVersion: "2.0"

  GreetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /greet
      Target: !Sub integrations/${LambdaIntegration}

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /health
      Target: !Sub integrations/${LambdaIntegration}

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AppName}-${EnvName}-api
      RetentionInDays: 30

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","time":"$context.requestTime","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency"}'

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GreetFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  # ---------- Front end: S3 static website (public read is its purpose), encrypted, versioned ----------
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AppName}-${EnvName}-web-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadForWebsite        # read-only, objects only
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"

Outputs:
  WebsiteUrl:
    Value: !GetAtt WebsiteBucket.WebsiteURL
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  BucketName:
    Value: !Ref WebsiteBucket
  FunctionName:
    Value: !Ref GreetFunction
  Version:
    Value: !Ref AppVersion
