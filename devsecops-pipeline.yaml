AWSTemplateFormatVersion: "2010-09-09"
Description: >
  devsecops-pipeline - DevSecOps release pipeline for the Greeter app (app.yaml).
  Source -> SecurityScans (Gitleaks, Semgrep+Bandit, Trivy+SBOM, Checkov in parallel, then StaticGate)
  -> Build (unit tests, package) -> DeployTest -> DynamicTests (Playwright browser tests + OWASP ZAP DAST)
  -> SecurityReview (FinalGate + approval with the security summary) -> DeployProd (+ smoke test, auto rollback).

Parameters:
  ConnectionArn:
    Type: String
    Description: ARN of an AVAILABLE CodeStar/CodeConnections GitHub connection
    Default: arn:aws:codeconnections:us-east-1:058264351046:connection/d57bdd7d-ac26-40c3-8f78-cd9951c91c6d
  RepositoryId:
    Type: String
    Default: MahmoudFathi/apache-service
    Description: GitHub owner/repository holding the app
  BranchName:
    Type: String
    Default: devsecops
  AppName:
    Type: String
    Default: devsecops
    AllowedPattern: "^[a-z][a-z0-9-]{1,20}$"
    Description: Prefix of the app stacks (<AppName>-test, <AppName>-prod) and of every resource here
  FailOn:
    Type: String
    Default: HIGH
    AllowedValues: [CRITICAL, HIGH, MEDIUM, LOW]
    Description: Lowest severity that blocks a release (unless listed in .security/exceptions.yml)

Resources:
  # ======================================================================= buckets
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AppName}-pipeline-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules: [{ Id: expire-old-artifacts, Status: Enabled, ExpirationInDays: 30 }]

  # Security reports stay PRIVATE (findings describe weaknesses); open them through the S3 console
  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AppName}-security-reports-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules: [{ Id: keep-reports-90-days, Status: Enabled, ExpirationInDays: 90 }]

  # ======================================================================= IAM
  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-cloudformation-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: deploy-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppName}-*
              - Effect: Allow
                Action: apigateway:*
                Resource: !Sub arn:aws:apigateway:${AWS::Region}::/*
              - Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:aws:s3:::${AppName}-*-web-${AWS::AccountId}
                  - !Sub arn:aws:s3:::${AppName}-*-web-${AWS::AccountId}/*
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}-*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${AppName}-*
              - Effect: Allow   # API Gateway access logging + log group lookups
                Action:
                  - logs:DescribeLogGroups
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${AppName}-*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${AppName}-*
                Condition:
                  StringEquals: { "iam:PassedToService": lambda.amazonaws.com }

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-codebuild-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build-scan-test-publish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AppName}-*
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketLocation, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
                  - !GetAtt ReportsBucket.Arn
                  - !Sub "${ReportsBucket.Arn}/*"
              - Effect: Allow   # publish the website and the browser test report to the test site
                Action: [s3:ListBucket, s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub arn:aws:s3:::${AppName}-*-web-${AWS::AccountId}
                  - !Sub arn:aws:s3:::${AppName}-*-web-${AWS::AccountId}/*
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-*
              - Effect: Allow
                Action: [codebuild:CreateReportGroup, codebuild:CreateReport, codebuild:UpdateReport, codebuild:BatchPutTestCases]
                Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/${AppName}-*

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-pipeline-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [codeconnections:UseConnection, codestar-connections:UseConnection]
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketVersioning, s3:GetBucketLocation, s3:ListBucket]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AppName}-*
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:SetStackPolicy
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-*
              - Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRole.Arn

  # ======================================================================= CodeBuild projects
  ScanSecretsProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AppName}-scan-secrets
      Description: Secret scan - Gitleaks
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source: { Type: CODEPIPELINE, BuildSpec: buildspecs/scan-secrets.yml }
      Artifacts: { Type: CODEPIPELINE }
      TimeoutInMinutes: 15
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: REPORTS_BUCKET, Value: !Ref ReportsBucket }
          - { Name: FAIL_ON, Value: !Ref FailOn }

  ScanSastProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AppName}-scan-sast
      Description: SAST - Semgrep + Bandit
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source: { Type: CODEPIPELINE, BuildSpec: buildspecs/scan-sast.yml }
      Artifacts: { Type: CODEPIPELINE }
      TimeoutInMinutes: 20
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: REPORTS_BUCKET, Value: !Ref ReportsBucket }
          - { Name: FAIL_ON, Value: !Ref FailOn }

  ScanScaProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AppName}-scan-sca
      Description: SCA + SBOM - Trivy
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source: { Type: CODEPIPELINE, BuildSpec: buildspecs/scan-sca.yml }
      Artifacts: { Type: CODEPIPELINE }
      TimeoutInMinutes: 15
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: REPORTS_BUCKET, Value: !Ref ReportsBucket }
          - { Name: FAIL_ON, Value: !Ref FailOn }

  ScanIacProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AppName}-scan-iac
      Description: IaC scan - Checkov
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source: { Type: CODEPIPELINE, BuildSpec: buildspecs/scan-iac.yml }
      Artifacts: { Type: CODEPIPELINE }
      TimeoutInMinutes: 20
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: REPORTS_BUCKET, Value: !Ref ReportsBucket }
          - { Name: FAIL_ON, Value: !Ref FailOn }

  GateProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AppName}-gate
      Description: Security gate - summary page, blocks on findings
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source: { Type: CODEPIPELINE, BuildSpec: buildspecs/gate.yml }
      Artifacts: { Type: CODEPIPELINE }
      TimeoutInMinutes: 10
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: REPORTS_BUCKET, Value: !Ref ReportsBucket }
          - { Name: FAIL_ON, Value: !Ref FailOn }

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AppName}-build
      Description: Unit tests + package the app template
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source: { Type: CODEPIPELINE, BuildSpec: buildspecs/build.yml }
      Artifacts: { Type: CODEPIPELINE }
      TimeoutInMinutes: 15
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: ARTIFACT_BUCKET, Value: !Ref ArtifactBucket }
          - { Name: APP_NAME, Value: !Ref AppName }

  WebProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AppName}-web
      Description: Publish the website to an environment's bucket
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source: { Type: CODEPIPELINE, BuildSpec: buildspecs/web.yml }
      Artifacts: { Type: CODEPIPELINE }
      TimeoutInMinutes: 10
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0

  E2EProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AppName}-e2e
      Description: Browser tests with Playwright (headless Chromium)
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source: { Type: CODEPIPELINE, BuildSpec: buildspecs/e2e.yml }
      Artifacts: { Type: CODEPIPELINE }
      TimeoutInMinutes: 20
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0

  DastProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AppName}-dast
      Description: DAST - OWASP ZAP baseline scan of the TEST website
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source: { Type: CODEPIPELINE, BuildSpec: buildspecs/dast.yml }
      Artifacts: { Type: CODEPIPELINE }
      TimeoutInMinutes: 30
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true          # runs the ZAP Docker container
        EnvironmentVariables:
          - { Name: REPORTS_BUCKET, Value: !Ref ReportsBucket }
          - { Name: FAIL_ON, Value: !Ref FailOn }

  # ======================================================================= pipeline
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${AppName}-pipeline
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore: { Type: S3, Location: !Ref ArtifactBucket }
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: GitHub
            Push:
              - Branches: { Includes: [!Ref BranchName] }
                FilePaths:   # changing only the pipeline definition or docs does not start a release
                  Excludes: [devsecops-pipeline.yaml, "**/*.md"]
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId: { Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: "1" }
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref RepositoryId
                BranchName: !Ref BranchName
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts: [{ Name: SourceArtifact }]

        - Name: SecurityScans
          Actions:
            - Name: SecretScan
              RunOrder: 1
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              Configuration:
                ProjectName: !Ref ScanSecretsProject
                EnvironmentVariables: '[{"name":"EXEC_ID","value":"#{codepipeline.PipelineExecutionId}","type":"PLAINTEXT"}]'
              InputArtifacts: [{ Name: SourceArtifact }]
            - Name: SAST
              RunOrder: 1
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              Configuration:
                ProjectName: !Ref ScanSastProject
                EnvironmentVariables: '[{"name":"EXEC_ID","value":"#{codepipeline.PipelineExecutionId}","type":"PLAINTEXT"}]'
              InputArtifacts: [{ Name: SourceArtifact }]
            - Name: DependencyScan
              RunOrder: 1
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              Configuration:
                ProjectName: !Ref ScanScaProject
                EnvironmentVariables: '[{"name":"EXEC_ID","value":"#{codepipeline.PipelineExecutionId}","type":"PLAINTEXT"}]'
              InputArtifacts: [{ Name: SourceArtifact }]
            - Name: IaCScan
              RunOrder: 1
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              Configuration:
                ProjectName: !Ref ScanIacProject
                EnvironmentVariables: '[{"name":"EXEC_ID","value":"#{codepipeline.PipelineExecutionId}","type":"PLAINTEXT"}]'
              InputArtifacts: [{ Name: SourceArtifact }]
            - Name: StaticGate
              RunOrder: 2
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              Configuration:
                ProjectName: !Ref GateProject
                EnvironmentVariables: >-
                  [{"name":"EXEC_ID","value":"#{codepipeline.PipelineExecutionId}","type":"PLAINTEXT"},
                  {"name":"GATE_TOOLS","value":"secrets,sast,sca,iac","type":"PLAINTEXT"},
                  {"name":"TITLE","value":"Static security scans","type":"PLAINTEXT"}]
              InputArtifacts: [{ Name: SourceArtifact }]

        - Name: Build
          Actions:
            - Name: UnitTestAndPackage
              Namespace: BuildVars
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              Configuration: { ProjectName: !Ref BuildProject }
              InputArtifacts: [{ Name: SourceArtifact }]
              OutputArtifacts: [{ Name: BuildArtifact }]

        - Name: DeployTest
          Actions:
            - Name: DeployStack
              Namespace: TestStack
              RunOrder: 1
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CloudFormation, Version: "1" }
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub ${AppName}-test
                TemplatePath: BuildArtifact::packaged.yaml
                TemplateConfiguration: BuildArtifact::test-params.json
                Capabilities: CAPABILITY_IAM
                RoleArn: !GetAtt CloudFormationRole.Arn
              InputArtifacts: [{ Name: BuildArtifact }]
            - Name: PublishWebsite
              RunOrder: 2
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              Configuration:
                ProjectName: !Ref WebProject
                EnvironmentVariables: !Sub >-
                  [{"name":"STACK_NAME","value":"${AppName}-test","type":"PLAINTEXT"},
                  {"name":"ENV_NAME","value":"test","type":"PLAINTEXT"}]
              InputArtifacts: [{ Name: SourceArtifact }]

        - Name: DynamicTests
          Actions:
            - Name: BrowserTests
              RunOrder: 1
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              Configuration:
                ProjectName: !Ref E2EProject
                EnvironmentVariables: !Sub >-
                  [{"name":"STACK_NAME","value":"${AppName}-test","type":"PLAINTEXT"},
                  {"name":"VERSION","value":"#{BuildVars.VERSION}","type":"PLAINTEXT"},
                  {"name":"PUBLISH_REPORT","value":"true","type":"PLAINTEXT"}]
              InputArtifacts: [{ Name: SourceArtifact }]
            - Name: DAST
              RunOrder: 1
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              Configuration:
                ProjectName: !Ref DastProject
                EnvironmentVariables: !Sub >-
                  [{"name":"STACK_NAME","value":"${AppName}-test","type":"PLAINTEXT"},
                  {"name":"EXEC_ID","value":"#{codepipeline.PipelineExecutionId}","type":"PLAINTEXT"}]
              InputArtifacts: [{ Name: SourceArtifact }]

        - Name: SecurityReview
          Actions:
            - Name: FinalGate
              RunOrder: 1
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              Configuration:
                ProjectName: !Ref GateProject
                EnvironmentVariables: >-
                  [{"name":"EXEC_ID","value":"#{codepipeline.PipelineExecutionId}","type":"PLAINTEXT"},
                  {"name":"GATE_TOOLS","value":"secrets,sast,sca,iac,dast","type":"PLAINTEXT"},
                  {"name":"TITLE","value":"Security summary - version #{BuildVars.VERSION}","type":"PLAINTEXT"}]
              InputArtifacts: [{ Name: SourceArtifact }]
            - Name: ApproveRelease
              RunOrder: 2
              ActionTypeId: { Category: Approval, Owner: AWS, Provider: Manual, Version: "1" }
              Configuration:
                CustomData: >-
                  Version #{BuildVars.VERSION} passed secret, SAST, dependency, IaC and DAST gates and the browser tests on TEST.
                  The link opens the security summary in the S3 console (click Open). Test site: #{TestStack.WebsiteUrl}
                  - review, then Approve to release to PROD.
                ExternalEntityLink: !Sub "https://s3.console.aws.amazon.com/s3/object/${ReportsBucket}?region=${AWS::Region}&prefix=runs/#{codepipeline.PipelineExecutionId}/index.html"

        - Name: DeployProd
          OnFailure:
            Result: ROLLBACK
          Actions:
            - Name: DeployStack
              Namespace: ProdStack
              RunOrder: 1
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CloudFormation, Version: "1" }
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub ${AppName}-prod
                TemplatePath: BuildArtifact::packaged.yaml
                TemplateConfiguration: BuildArtifact::prod-params.json
                Capabilities: CAPABILITY_IAM
                RoleArn: !GetAtt CloudFormationRole.Arn
              InputArtifacts: [{ Name: BuildArtifact }]
            - Name: PublishWebsite
              RunOrder: 2
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              Configuration:
                ProjectName: !Ref WebProject
                EnvironmentVariables: !Sub >-
                  [{"name":"STACK_NAME","value":"${AppName}-prod","type":"PLAINTEXT"},
                  {"name":"ENV_NAME","value":"prod","type":"PLAINTEXT"}]
              InputArtifacts: [{ Name: SourceArtifact }]
            - Name: SmokeTest
              RunOrder: 3
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              Configuration:
                ProjectName: !Ref E2EProject
                EnvironmentVariables: !Sub >-
                  [{"name":"STACK_NAME","value":"${AppName}-prod","type":"PLAINTEXT"},
                  {"name":"VERSION","value":"#{BuildVars.VERSION}","type":"PLAINTEXT"},
                  {"name":"GREP","value":"@smoke","type":"PLAINTEXT"},
                  {"name":"PUBLISH_REPORT","value":"false","type":"PLAINTEXT"}]
              InputArtifacts: [{ Name: SourceArtifact }]

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  ReportsBucketName:
    Description: Private bucket with the security summary of every run (runs/<execution id>/index.html)
    Value: !Ref ReportsBucket
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  TestStackName:
    Value: !Sub ${AppName}-test
  ProdStackName:
    Value: !Sub ${AppName}-prod
